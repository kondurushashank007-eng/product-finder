{% extends "base.html" %}

{% block title %}Page Not Found - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding: 4rem 1rem; text-align: center;">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
  <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
  <p style="font-size: 1rem; color: var(--text-sub); margin-bottom: 1.5rem;">
    {{ message or "The page or shop you are looking for does not exist or may have been moved." }}
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('customer.home') }}" class="btn btn-primary">Go to Home</a>
    <a href="{{ url_for('customer.search') }}" class="btn btn-outline">Search Products</a>
  </div>
</div>
{% endblock %}
